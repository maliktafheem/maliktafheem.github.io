<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Budget Buddy — a private personal-finance app for tracking expenses, income, and budgets. No ads, no tracking.">
  <meta name="apple-mobile-web-app-title" content="Budget Buddy">
  <title>Budget Buddy</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    :root {
      --brand: #6E1B3A;
      --brand-dark: #54142C;
      --ink: #1f2329;
      --muted: #5b6470;
      --card: #ffffff;
      --border: #e7e2e4;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #6E1B3A 0%, #54142C 100%);
      line-height: 1.6;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .hero {
      background: var(--card);
      border-radius: 18px;
      max-width: 460px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      margin: 0 auto 18px;
      display: block;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.9rem;
      color: var(--brand);
      letter-spacing: 0.2px;
    }
    .tagline {
      margin: 0 auto 26px;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 360px;
    }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 18px;
      border-radius: 10px;
      border: 2px solid var(--brand);
    }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-outline { background: #fff; color: var(--brand); }
    .btn-outline:hover { background: #f7eef2; }
    footer {
      text-align: center;
      color: rgba(255,255,255,0.85);
      font-size: 0.85rem;
      padding: 0 20px 28px;
    }
    footer a { color: #fff; }
    @media (max-width: 480px) {
      .hero { padding: 32px 22px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <img class="logo" src="icons/Icon-192.png" alt="Budget Buddy logo" />
      <h1>Budget Buddy</h1>
      <p class="tagline">Track your expenses, income, and budgets — privately. No ads, no tracking.</p>
      <div class="links">
        <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.budgetbuddy.expense_tracker">Get it on Google Play</a>
        <a class="btn btn-outline" href="privacy.html">Privacy Policy</a>
        <a class="btn btn-outline" href="terms.html">Terms &amp; Disclaimers</a>
        <a class="btn btn-outline" href="delete-account.html">Delete My Account</a>
      </div>
    </div>
  </main>
  <footer>
    &copy; Budget Buddy &middot; Questions? <a href="mailto:support@budgetbuddy.app">support@budgetbuddy.app</a>
  </footer>
</body>
</html>
